name: Bug report
description: Report a reproducible defect
title: "[Bug]: "
body:
  - type: textarea
    id: summary
    attributes: {label: Summary, description: What happened?}
    validations: {required: true}
  - type: textarea
    id: reproduce
    attributes: {label: Steps to reproduce}
    validations: {required: true}
  - type: textarea
    id: expected
    attributes: {label: Expected behavior}
    validations: {required: true}
