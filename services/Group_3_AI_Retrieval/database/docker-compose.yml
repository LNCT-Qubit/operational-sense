services:
  db:
    image: pgvector/pgvector:pg16
    container_name: opsense-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"  # loopback only: never expose the DB on all interfaces
    volumes:
      - opsense_pgdata:/var/lib/postgresql/data

volumes:
  opsense_pgdata:
